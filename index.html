  <script type="module" crossorigin src="./assets/game-DIgfmAyz.js"></script>
</head>
<body>
  <div id="duel-root"></div>
  <div id="shell-root"></div>
  <div id="notice" hidden>
    <span id="notice-msg"></span>
    <button id="notice-dismiss" type="button" aria-label="Dismiss">✕</button>
  </div>
  <div class="gs-boot" id="boot">
    <!-- Background layers: instant blurred placeholder, then full plate and front parallax drift -->
    <div class="bt-bg-placeholder" style="background-image: url('data:image/webp;base64,UklGRq4BAABXRUJQVlA4IKIBAACQCACdASowABsAPrVQok0nJCMiKrgIAOAWiWIAsR9ZALI7ZbjcBGS63qINk4ekdzy+ENlbr5V3LTZEf1Ei+3q4qK1s4JKAl7Kf+LKysAD+6u2d6FccY++pMUL9oBZHLB4eHP8Hgy62EDHgZjeAshUdO+QGP0XOFGsbRxwqNn4crvsp9AG5VT/tyuXVmYPa/k3yExfxpzAngv/BlDqca1icIo6twzqGCKFwhKPAMZTmL73w63PmVLLKbnO14TWQWwUx3vO5smK9AWxAOQ9P0/zHcs6+8IHK3+2oUruEsJ3pPmC1/bMDVGuvGJs4v+gZ4dIPpLEjsOhcS4CJLdP4l/hne0q7/pZv+9gDLWAdsbCGy4o9s2tOBi870AfhrB/DMfNmPDXAwc7PQDq5pJ05i0OaQLCulPCiZSq51VdNZ/G9BPOe+Hikjujlo9d7A2b+x1J3t7KzQo35B+2S2cADQsRlK7M4khB6I5dK8TOTNBFQp5Y9VYrUo5nzSK3b8rBcfVzdlFwsAHIyG5IYcj/k1+d9TgHX5nNdTjwsHAHhMopFwAAA');"></div>
    <div class="bt-bg-plate"></div>
    <div class="bt-bg-front"></div>
    <div class="bt-bg-overlay"></div>

    <!-- Centred main column -->
    <div class="bt-col">
      <!-- 1. Header: Title + Subtitle -->
      <header class="bt-header">
        <h1 class="bt-title">Kage no Kagami</h1>
        <div class="bt-sub"></div>
      </header>

      <!-- 2. Centrepiece: The Mirror of Shadows (and duel banners in duel mode) -->
      <div class="bt-center-stage">
        <!-- Hero Duel Banner (duel mode only, lobby banner style) -->
        <div class="bt-duel-banner bt-duel-banner-hero">
          <span class="bt-duel-banner-rod" aria-hidden="true"></span>
          <div class="bt-medallion bt-medallion-hero">
            <span class="bt-medallion-placeholder">影</span>
            <img class="bt-medallion-img bt-duel-hero-img" alt="Hero" />
          </div>
          <div class="bt-duel-meta">
            <span class="bt-duel-name bt-duel-hero-name">Hero</span>
          </div>
        </div>

        <!-- The Mirror of Shadows -->
        <div class="bt-mirror-wrap">
          <!-- Ink Ensō Brush Circle (under 2 KB inline SVG, draws once on show) -->
          <svg class="bt-enso" viewBox="0 0 200 200" aria-hidden="true">
            <path class="bt-enso-path" d="M 100,18 C 146,17 184,54 184,100 C 184,146 146,182 100,182 C 54,182 16,146 16,100 C 16,54 54,19 96,18 C 114,17 138,22 152,32" fill="none" stroke="#1B1410" stroke-width="8" stroke-linecap="round" />
          </svg>

          <!-- Bronze Mirror Body -->
          <div class="bt-mirror">
            <!-- Engraved ring with 8 notches -->
            <div class="bt-mirror-notches" aria-hidden="true"></div>
            <!-- Mirror dark glass face -->
            <div class="bt-mirror-face">
              <!-- Sheen sweep -->
              <div class="bt-mirror-sheen" aria-hidden="true"></div>
              <!-- Hanko seal glowing faintly in center -->
              <div class="bt-mirror-seal">影</div>
              <!-- Duel Versus Seal (active in duel mode, sits on the glass) -->
              <div class="bt-vs-seal" aria-hidden="true">VS</div>
            </div>
          </div>

          <!-- Red silk cord with tassel hanging under it -->
          <div class="bt-mirror-tassel" aria-hidden="true">
            <svg class="bt-tassel-svg" viewBox="0 0 36 48" fill="none">
              <path d="M 18,0 L 18,8 M 13,8 Q 18,4 23,8 Q 26,12 18,14 Q 10,12 13,8 Z" stroke="#E8483E" stroke-width="2.2" fill="#C8282E" stroke-linejoin="round"/>
              <circle cx="18" cy="16" r="3.5" fill="#FFD978" stroke="#8E1519" stroke-width="1"/>
              <path d="M 14,20 C 14,30 11,40 10,46 M 16,20 C 16,31 15,41 14,47 M 18,20 C 18,31 18,42 18,48 M 20,20 C 20,31 21,41 22,47 M 22,20 C 22,30 25,40 26,46" stroke="#C8282E" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>

          <!-- Arena name (active in duel mode, sits under tassel) -->
          <div class="bt-duel-arena"></div>
        </div>

        <!-- Rival Duel Banner (duel mode only, lobby banner style) -->
        <div class="bt-duel-banner bt-duel-banner-rival">
          <span class="bt-duel-banner-rod" aria-hidden="true"></span>
          <div class="bt-medallion bt-medallion-rival">
            <span class="bt-medallion-placeholder">敵</span>
            <img class="bt-medallion-img bt-duel-rival-img" alt="Rival" />
          </div>
          <div class="bt-duel-meta">
            <span class="bt-duel-name bt-duel-rival-name">Rival</span>
            <span class="bt-duel-tier bt-duel-rival-tier">★★★</span>
          </div>
        </div>
      </div>

      <!-- 3. Card banner slot (under mirror) -->
      <div class="bt-card-wrap">
        <div class="bt-card-slot" aria-live="polite">
          <div class="gs-banner bt-card">
            <span class="gs-banner-rod"></span>
            <div class="gs-banner-title">Loading...</div>
          </div>
        </div>
      </div>

      <!-- 4. Bottom Bar: Petal Cut HUD, Katana progress bar, Stage label & Bytes counter -->
      <div class="bt-bottom-bar">
        <!-- Score / Hint Line -->
        <div class="bt-petal-hud">
          <span class="bt-petal-hint">
            <span class="bt-swipe-icon" aria-hidden="true"></span>
            <span class="bt-hint-text">Swipe to cut the petals</span>
          </span>
          <span class="bt-score-box">
            <span class="bt-score-val">0</span>
            <span class="bt-petal-best">Best 0</span>
          </span>
          <span class="bt-combo" hidden></span>
        </div>

        <!-- Katana Sword Progress Track -->
        <div class="bt-katana-wrap">
          <div class="bt-handle" aria-hidden="true"></div>
          <div class="bt-tsuba" aria-hidden="true"></div>
          <div class="bt-scabbard">
            <div class="bt-blade">
              <div class="bt-blade-glint"></div>
            </div>
            <div class="bt-percent">0%</div>
          </div>
        </div>

        <!-- Stage & Bytes Line -->
        <div class="bt-meta-row">
          <span class="bt-stage">Waking the hero</span>
          <bdi class="bt-bytes" dir="ltr"></bdi>
        </div>

        <div class="bt-slow" hidden></div>
        <div class="bt-ready-prompt" hidden></div>
      </div>
    </div>
  </div>
</body>
</html>
